<svg width="100%" viewBox="0 0 680 610" role="img" xmlns="http://www.w3.org/2000/svg">
<title>JACK-IN conversation outcomes</title>
<desc>Flow from jacking into an infected robot through the per-turn reactions (convert, stand down, flee, refuse) to the resulting robot states, and how the channel closes.</desc>
<style>
  svg { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .t  { font-size: 14px; font-weight: 400; fill: #1A1D21; }
  .th { font-size: 14px; font-weight: 500; fill: #1A1D21; }
  .ts { font-size: 12px; font-weight: 400; fill: #5A6069; }
  .box { fill: #F7F8F9; stroke: #C9CDD3; stroke-width: 1; }
  .edge { stroke: #9AA0A8; stroke-width: 1; fill: none; }
  .dashed { fill: none; stroke: #9AA0A8; stroke-width: 1; stroke-dasharray: 5 4; }
  .c-teal  rect { fill: #D9F2EF; stroke: #3FA99B; stroke-width: 1; }
  .c-teal  .th, .c-teal .ts { fill: #0B5A50; }
  .c-blue  rect { fill: #E3EEFB; stroke: #4A82C4; stroke-width: 1; }
  .c-blue  .th, .c-blue .ts { fill: #123A66; }
  .c-amber rect { fill: #FBEFD6; stroke: #C79A3E; stroke-width: 1; }
  .c-amber .th, .c-amber .ts { fill: #6B4E12; }
  .c-red   rect { fill: #FBE1DE; stroke: #C75B52; stroke-width: 1; }
  .c-red   .th, .c-red .ts { fill: #7A2B23; }
  .c-gray  rect { fill: #ECEEF0; stroke: #AEB4BB; stroke-width: 1; }
  .c-gray  .th, .c-gray .ts { fill: #3A3F45; }
  @media (prefers-color-scheme: dark) {
    .t, .th { fill: #E6E8EB; }
    .ts { fill: #A0A6AE; }
    .box { fill: #23262B; stroke: #3A3F45; }
    .edge, .dashed { stroke: #6B7178; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect class="box" x="190" y="40" width="300" height="44" rx="6"/>
<text class="th" x="340" y="60" text-anchor="middle">Aim at infected robot → press E</text>
<text class="ts" x="340" y="76" text-anchor="middle">spends 1 uplink charge (of 3)</text>
<line class="edge" x1="340" y1="84" x2="340" y2="104" marker-end="url(#arrow)"/>

<rect class="box" x="170" y="104" width="340" height="64" rx="6"/>
<text class="th" x="340" y="126" text-anchor="middle">CHANNEL OPEN — horde frozen</text>
<text class="ts" x="340" y="145" text-anchor="middle">you talk (text or voice); it replies + reacts</text>
<text class="ts" x="340" y="161" text-anchor="middle">≤ 3 turns · ~22 s real-time window</text>

<line class="edge" x1="340" y1="168" x2="340" y2="188"/>
<line class="edge" x1="106" y1="188" x2="574" y2="188"/>
<line class="edge" x1="106" y1="188" x2="106" y2="210" marker-end="url(#arrow)"/>
<line class="edge" x1="262" y1="188" x2="262" y2="210" marker-end="url(#arrow)"/>
<line class="edge" x1="418" y1="188" x2="418" y2="210" marker-end="url(#arrow)"/>
<line class="edge" x1="574" y1="188" x2="574" y2="210" marker-end="url(#arrow)"/>

<rect class="box" x="40" y="210" width="132" height="46" rx="6"/>
<text class="th" x="106" y="232" text-anchor="middle">CONVERT</text>
<text class="ts" x="106" y="248" text-anchor="middle">switch sides</text>
<rect class="box" x="196" y="210" width="132" height="46" rx="6"/>
<text class="th" x="262" y="232" text-anchor="middle">STAND DOWN</text>
<text class="ts" x="262" y="248" text-anchor="middle">power down</text>
<rect class="box" x="352" y="210" width="132" height="46" rx="6"/>
<text class="th" x="418" y="232" text-anchor="middle">FLEE</text>
<text class="ts" x="418" y="248" text-anchor="middle">runs off</text>
<rect class="box" x="508" y="210" width="132" height="46" rx="6"/>
<text class="th" x="574" y="232" text-anchor="middle">REFUSE</text>
<text class="ts" x="574" y="248" text-anchor="middle">keeps fighting</text>

<line class="edge" x1="106" y1="256" x2="106" y2="300" marker-end="url(#arrow)"/>
<line class="edge" x1="262" y1="256" x2="262" y2="300" marker-end="url(#arrow)"/>
<line class="edge" x1="418" y1="256" x2="418" y2="300" marker-end="url(#arrow)"/>
<line class="edge" x1="574" y1="256" x2="574" y2="300" marker-end="url(#arrow)"/>

<g class="c-teal"><rect x="40" y="300" width="132" height="60" rx="6"/>
<text class="th" x="106" y="322" text-anchor="middle">ALLY (cyan)</text>
<text class="ts" x="106" y="340" text-anchor="middle">persistent win</text>
<text class="ts" x="106" y="356" text-anchor="middle">meter ≥ line</text></g>
<text class="ts" x="106" y="377" text-anchor="middle">else → keep talking</text>

<g class="c-blue"><rect x="196" y="300" width="132" height="60" rx="6"/>
<text class="th" x="262" y="322" text-anchor="middle">STANDS DOWN</text>
<text class="ts" x="262" y="340" text-anchor="middle">frozen ~4.5 s</text>
<text class="ts" x="262" y="356" text-anchor="middle">temporary</text></g>

<g class="c-amber"><rect x="352" y="300" width="132" height="60" rx="6"/>
<text class="th" x="418" y="322" text-anchor="middle">FLEES</text>
<text class="ts" x="418" y="340" text-anchor="middle">runs ~3.5 s</text>
<text class="ts" x="418" y="356" text-anchor="middle">temporary</text></g>

<g class="c-gray"><rect x="508" y="300" width="132" height="60" rx="6"/>
<text class="th" x="574" y="322" text-anchor="middle">FIGHTS ON</text>
<text class="ts" x="574" y="340" text-anchor="middle">meter drops</text>
<text class="ts" x="574" y="356" text-anchor="middle">talk on</text></g>

<line class="edge" x1="574" y1="360" x2="574" y2="400" marker-end="url(#arrow)"/>
<g class="c-red"><rect x="508" y="400" width="132" height="58" rx="6"/>
<text class="th" x="574" y="420" text-anchor="middle">ENRAGED</text>
<text class="ts" x="574" y="438" text-anchor="middle">buffed ~10 s</text>
<text class="ts" x="574" y="453" text-anchor="middle">if pushed hard</text></g>

<rect class="dashed" x="40" y="474" width="600" height="92" rx="6"/>
<text class="th" x="56" y="496">When the channel closes</text>
<text class="ts" x="56" y="516">Deal made → SUCCESS: the reaction above sticks.</text>
<text class="ts" x="56" y="536">No deal (turns up · timeout · leave) → resolves to stand-down / enrage / hostile.</text>
<text class="ts" x="56" y="556">Robot dies or run resets → channel just closes.</text>

<g class="c-teal"><rect x="40" y="576" width="14" height="14" rx="3"/></g>
<text class="ts" x="58" y="587">ally — persistent</text>
<g class="c-blue"><rect x="196" y="576" width="14" height="14" rx="3"/></g>
<text class="ts" x="214" y="587">stands down (temp)</text>
<g class="c-amber"><rect x="360" y="576" width="14" height="14" rx="3"/></g>
<text class="ts" x="378" y="587">flees (temp)</text>
<g class="c-red"><rect x="486" y="576" width="14" height="14" rx="3"/></g>
<text class="ts" x="504" y="587">enraged</text>
<g class="c-gray"><rect x="572" y="576" width="14" height="14" rx="3"/></g>
<text class="ts" x="590" y="587">hostile</text>
</svg>
