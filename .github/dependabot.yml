version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    # Cover PackageReference manifests wherever they are added in the monorepo.
    directories:
      - "**/*"
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: deps
    groups:
      dotnet:
        patterns: ["*"]
    ignore:
      # Roslyn analyzer and source-generator packages are locked to the compiler
      # shipped by the pinned .NET SDK, not to the newest release. An assembly
      # built against a newer Microsoft.CodeAnalysis than the running compiler is
      # refused with CS9057, which silently disables the analyzer and makes every
      # generated member vanish. Dependabot cannot see that constraint, so hold
      # these at the major version the pinned SDK's compiler accepts.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
        update-types: ["version-update:semver-major"]

  # The website is pending on the bootstrap branch. This entry becomes active
  # when its package.json and package-lock.json are promoted to the default branch.
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: deps
    groups:
      website:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /packages/launcher_domain
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: deps
    groups:
      launcher-domain:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /packages/launcher_data
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: deps
    groups:
      launcher-data:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /packages/launcher_ui
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: deps
    groups:
      launcher-ui:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /apps/topiaforge_cli
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: deps
    groups:
      cli:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /apps/topiaforge_launcher_flutter
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: deps
    groups:
      launcher-app:
        patterns: ["*"]
