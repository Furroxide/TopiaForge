version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    # Cover PackageReference manifests wherever they are added in the monorepo.
    directories:
      - "**/*"
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: deps
    groups:
      roslyn:
        patterns: ["Microsoft.CodeAnalysis.*"]
      dotnet:
        patterns: ["*"]
        exclude-patterns: ["Microsoft.CodeAnalysis.*"]
    ignore:
      # Keep analyzers and generators compatible with the compiler in the pinned SDK.
      # Workspaces must share the hold because it can pull in a newer CSharp package.
      - dependency-name: "Microsoft.CodeAnalysis.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /tools/ugc-automerge-sidecar
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: deps
    groups:
      sidecar:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: deps
    groups:
      website:
        patterns: ["*"]
    ignore:
      # The current website toolchain does not accept the next TypeScript major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /services/control-plane
    schedule:
      interval: weekly
    target-branch: dev
    cooldown:
      default-days: 14
    commit-message:
      prefix: deps
    groups:
      control-plane:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /packages/launcher_domain
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: deps
    groups:
      launcher-domain:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /packages/launcher_data
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: deps
    groups:
      launcher-data:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /packages/launcher_ui
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: deps
    groups:
      launcher-ui:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /apps/topiaforge_cli
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: deps
    groups:
      cli:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /apps/topiaforge_launcher_flutter
    schedule:
      interval: weekly
    target-branch: dev
    commit-message:
      prefix: deps
    groups:
      launcher-app:
        patterns: ["*"]
