name: Set up pinned Flutter
description: Install the repository-pinned Flutter SDK from a verified official archive.

inputs:
  install_directory:
    description: Optional dedicated install directory inside a verified neutral build root.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Shared with Pages and release jobs: never register a post-job cache save.
    - name: Restore the pinned Flutter archive
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/topiaforge-flutter-archives
        key: >-
          topiaforge-flutter-archive-v1-${{ runner.os }}-${{ runner.arch }}-3.44.6-${{
          hashFiles('.github/actions/setup-flutter/releases.json') }}

    - name: Install and verify the pinned Flutter SDK
      shell: pwsh
      env:
        TOPIAFORGE_FLUTTER_ARCHIVE_DIRECTORY: ${{ runner.temp }}/topiaforge-flutter-archives
        TOPIAFORGE_FLUTTER_INSTALL_DIRECTORY: ${{ inputs.install_directory || format('{0}/topiaforge-flutter-sdk', runner.temp) }}
      run: '& "$env:GITHUB_ACTION_PATH/install-flutter.ps1"'
