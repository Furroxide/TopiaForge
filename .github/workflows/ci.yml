name: CI

on:
  pull_request:
    branches:
      - main
      - dev
      - "release/**"
  push:
    branches:
      - main
      - dev
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dart-tests:
    name: Analyze and test Dart packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/launcher_domain
          - packages/launcher_data
          - apps/robotopia_cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.11.1"

      - name: Set up .NET
        if: matrix.package == 'apps/robotopia_cli'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: |
          if git ls-files --error-unmatch -- pubspec.lock >/dev/null 2>&1; then
            dart pub get --enforce-lockfile
          else
            dart pub get
          fi
          dart analyze --fatal-infos

      - name: Test
        working-directory: ${{ matrix.package }}
        run: dart test

  flutter-tests:
    name: Analyze and test Flutter packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          cache: true

      - name: Analyze and test shared UI
        working-directory: packages/launcher_ui
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Analyze and test launcher
        working-directory: apps/robotopia_launcher_flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test

  sidecar-checks:
    name: Validate UGC Automerge sidecar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/ugc-automerge-sidecar/package-lock.json

      - name: Restore and check sidecar
        working-directory: tools/ugc-automerge-sidecar
        run: |
          npm ci --no-audit --no-fund
          node --check index.mjs
          npm test
          output="$(node index.mjs --check)"
          echo "$output"
          grep -F "deps        : installed" <<< "$output"

  # Scaffold + validate + pack every mod template so template rot is caught
  # on the PR that causes it, not at the next release.
  template-matrix:
    name: Template ${{ matrix.template }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [minimal, gameplay, gamemode, service, ui, asset, world]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.11.1"

      - name: Install archive dependencies
        if: matrix.template == 'ui'
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Resolve Robotopia refs cache key
        if: matrix.template == 'ui'
        id: refs-cache
        shell: pwsh
        env:
          ROBOTOPIA_REFS_SOURCE_PLATFORM: ${{ vars.ROBOTOPIA_REFS_SOURCE_PLATFORM }}
        run: ./tools/restore-robotopia-managed-refs.ps1 -Source public -CacheKeyOnly

      - name: Cache Robotopia managed refs
        if: matrix.template == 'ui'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/robotopia-managed-refs-cache
          key: ${{ steps.refs-cache.outputs.key }}

      - name: Restore Robotopia managed refs
        if: matrix.template == 'ui'
        shell: pwsh
        env:
          ROBOTOPIA_REFS_CACHE: ${{ runner.temp }}/robotopia-managed-refs-cache
          ROBOTOPIA_REFS_SOURCE_PLATFORM: ${{ vars.ROBOTOPIA_REFS_SOURCE_PLATFORM }}
        run: ./tools/restore-robotopia-managed-refs.ps1 -Source public

      # Scaffolds inside the checkout (not RUNNER_TEMP) so the generated
      # ProjectReference to src/Robotopia.Mods.Abstractions stays a relative
      # path, matching the release workflow's smoke test.
      - name: Scaffold, validate, pack, and re-validate
        shell: bash
        working-directory: apps/robotopia_cli
        run: |
          dart pub get --enforce-lockfile
          dart run bin/robotopia.dart new mod "ci.${{ matrix.template }}" \
            --template "${{ matrix.template }}" \
            --name "CI ${{ matrix.template }}" \
            --dir ../../.ci-smoke
          dart run bin/robotopia.dart check package "../../.ci-smoke/ci.${{ matrix.template }}"
          package=$(dart run bin/robotopia.dart pack \
            --project "../../.ci-smoke/ci.${{ matrix.template }}" \
            --output "$RUNNER_TEMP/ci-pack" | tail -1)
          echo "Packed: $package"
          dart run bin/robotopia.dart check package "$package"
