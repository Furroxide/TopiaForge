name: Deploy complete documentation Pages site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Pages replaces the complete site. Never cancel an in-flight publication or
# allow CI and release refreshes to publish out of order.
concurrency:
  group: topiaforge-pages-publication
  cancel-in-progress: false

jobs:
  dispatch-stable-release:
    name: Refresh Pages from the immutable stable release
    if: >-
      github.event_name == 'release' &&
      !github.event.release.draft &&
      !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Require an immutable versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          release=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          jq -e \
            --argjson id "$RELEASE_ID" \
            --arg tag "$RELEASE_TAG" \
            '.id == $id and
             .tag_name == $tag and
             .draft == false and
             .prerelease == false and
             .published_at != null and
             .immutable == true' <<<"$release" >/dev/null

      # GitHub explicitly permits GITHUB_TOKEN workflow_dispatch events to
      # create a new run; other GITHUB_TOKEN-created events remain suppressed.
      - name: Dispatch the exact immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh workflow run deploy-pages.yml --ref "$RELEASE_TAG" --repo "$GH_REPO"

  build-pages:
    name: Build and validate complete Pages payload
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: read
    outputs:
      manual_releases: ${{ steps.feeds.outputs.manual_releases }}
      registry_mod_count: ${{ steps.feeds.outputs.registry_mod_count }}
    steps:
      - name: Checkout exact triggering revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          lfs: true
          persist-credentials: false

      - name: Require a trusted Pages source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if test "$SOURCE_REF" = refs/heads/main; then
            exit 0
          fi

          [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test "$SOURCE_REF" = "refs/tags/$SOURCE_TAG"
          release=$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$SOURCE_TAG")
          jq -e \
            --arg tag "$SOURCE_TAG" \
            '.tag_name == $tag and
             .draft == false and
             .prerelease == false and
             .published_at != null and
             .immutable == true' <<<"$release" >/dev/null

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.301"

      - name: Set up Flutter and Dart
        uses: ./.github/actions/setup-flutter

      - name: Verify pinned runtimes
        run: |
          test "$(node --version)" = v24.16.0
          test "$(dotnet --version)" = 10.0.301
          test "$(dart --version 2>&1 | awk '{print $4}')" = 3.12.2
          test "$(flutter --version --machine | jq -r .frameworkVersion)" = 3.44.6

      - name: Install managed-reference archive dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Resolve Robotopia refs cache key
        id: refs-cache
        shell: pwsh
        env:
          ROBOTOPIA_REFS_SOURCE_PLATFORM: ${{ vars.ROBOTOPIA_REFS_SOURCE_PLATFORM }}
        run: >-
          dotnet run
          --project tools/TopiaForge.ManagedRefs/TopiaForge.ManagedRefs.csproj
          -c Release -- --source public --cache-key-only

      - name: Cache Robotopia managed refs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/robotopia-managed-refs-cache
          key: ${{ steps.refs-cache.outputs.key }}

      - name: Restore Robotopia managed refs
        shell: pwsh
        env:
          ROBOTOPIA_REFS_CACHE: ${{ runner.temp }}/robotopia-managed-refs-cache
          ROBOTOPIA_REFS_SOURCE_PLATFORM: ${{ vars.ROBOTOPIA_REFS_SOURCE_PLATFORM }}
        run: >-
          dotnet run
          --project tools/TopiaForge.ManagedRefs/TopiaForge.ManagedRefs.csproj
          -c Release -- --source public --require-latest

      - name: Restore pinned .NET tools
        run: dotnet tool restore

      - name: Restore CLI packages
        working-directory: apps/topiaforge_cli
        run: dart pub get --enforce-lockfile

      - name: Restore website packages
        working-directory: website
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build guides, references, evidence, and unified search
        working-directory: website
        env:
          ASTRO_TELEMETRY_DISABLED: true
        run: npm run check

      - name: Generate official feeds and assemble Pages
        id: feeds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          staging_root=$(mktemp -d "$RUNNER_TEMP/topiaforge-pages.XXXXXX")
          trap 'rm -rf "$staging_root"' EXIT
          feeds="$staging_root/feeds"
          updates="$staging_root/updates"
          mkdir -p "$feeds"

          (
            cd apps/topiaforge_cli
            dart run topiaforge updates index \
              --repository "$GITHUB_REPOSITORY" \
              --output "$updates" \
              --base-url https://docs.topiaforge.dev/ \
              --skip-if-no-stable-release
          )
          if test -f "$updates/manual-releases.json"; then
            install -m 0644 "$updates/manual-releases.json" "$feeds/manual-releases.json"
            echo "manual_releases=true" >> "$GITHUB_OUTPUT"
          else
            echo "manual_releases=false" >> "$GITHUB_OUTPUT"
          fi

          (
            cd apps/topiaforge_cli
            dart run topiaforge registry index \
              --repository "$GITHUB_REPOSITORY" \
              --changelogs ../../mods \
              --output "$feeds/registry"
          )
          # Record what was generated so the post-deploy smoke can prove the
          # served index matches it. Without this the smoke's `all(.mods[]; ...)`
          # is vacuously true on an empty array, so a silent collection failure
          # (release assets renamed, listReleases returning nothing) would
          # publish an empty registry and still pass.
          registry_mod_count=$(jq '.mods | length' "$feeds/registry/index.json")
          echo "registry_mod_count=$registry_mod_count" >> "$GITHUB_OUTPUT"
          touch "$feeds/.nojekyll"

          test ! -e "$GITHUB_WORKSPACE/_site"
          node website/scripts/assemble-pages.mjs \
            --site website/dist \
            --feeds "$feeds" \
            --output "$GITHUB_WORKSPACE/_site"

      # actions/upload-pages-artifact is inlined below. It is itself pinned,
      # but internally references actions/upload-artifact@v4 by tag, and this
      # repository requires every action -- nested ones included -- to be
      # pinned to a full-length commit SHA. These are the Linux steps of that
      # composite action, unchanged; the artifact name stays github-pages
      # because actions/deploy-pages resolves that exact name.
      - name: Archive complete Pages artifact
        shell: bash
        env:
          INPUT_PATH: _site
        run: |
          set -euo pipefail
          tar \
            --dereference --hard-dereference \
            --directory "$INPUT_PATH" \
            -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .

      - name: Upload complete Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Publish prebuilt Pages artifact
    needs: build-pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No checkout or repository command executes with Pages/OIDC authority.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  smoke:
    name: Smoke-test deployed HTTPS routes
    needs: [build-pages, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Verify the public portal and generated content
        env:
          HAS_MANUAL_RELEASES: ${{ needs.build-pages.outputs.manual_releases }}
          REGISTRY_MOD_COUNT: ${{ needs.build-pages.outputs.registry_mod_count }}
        run: |
          set -euo pipefail
          base=https://docs.topiaforge.dev
          smoke_root=$(mktemp -d "$RUNNER_TEMP/topiaforge-smoke.XXXXXX")
          trap 'rm -rf "$smoke_root"' EXIT
          fetch() {
            curl --fail --silent --show-error --location \
              --retry 12 --retry-all-errors --retry-delay 10 \
              --connect-timeout 10 --max-time 30 \
              "$base$1" --output "$2"
            test -s "$2"
          }

          fetch / "$smoke_root/portal.html"
          grep -q 'TopiaForge' "$smoke_root/portal.html"
          fetch /api/csharp/ "$smoke_root/csharp.html"
          grep -q 'TopiaForge V1 C# API' "$smoke_root/csharp.html"
          fetch /api/dart/ "$smoke_root/dart.html"
          grep -q 'TopiaForge Dart API reference' "$smoke_root/dart.html"
          for package in launcher_domain launcher_data launcher_ui; do
            fetch "/api/dart/$package/" "$smoke_root/$package.html"
          done
          fetch /pagefind/pagefind.js "$smoke_root/pagefind.js"
          fetch /registry/index.json "$smoke_root/registry.json"
          # The mod count is compared against what generation actually produced.
          # `all(.mods[]; ...)` alone is vacuously true on an empty array, so on
          # its own it cannot distinguish a correct registry from a lost one.
          jq -e --argjson expected "$REGISTRY_MOD_COUNT" \
            '.formatVersion == 2
              and all(.mods[]; .origin == "first-party")
              and (.mods | length) == $expected' \
            "$smoke_root/registry.json" >/dev/null
          fetch /source/docs/capability-matrix.json "$smoke_root/capabilities.json"
          fetch /source/tests/live-game-acceptance.json "$smoke_root/acceptance.json"

          if test "$HAS_MANUAL_RELEASES" = true; then
            fetch /manual-releases.json "$smoke_root/manual-releases.json"
            jq -e \
              '.formatVersion == 2 and .manualOnly == true and
              (.platforms | keys | sort) == ["linux", "macos", "windows"]' \
              "$smoke_root/manual-releases.json" >/dev/null
          else
            status=$(curl --silent --show-error --location \
              --retry 12 --retry-all-errors --retry-delay 10 \
              --connect-timeout 10 --max-time 30 \
              --output /dev/null --write-out '%{http_code}' \
              "$base/manual-releases.json")
            test "$status" = 404
          fi
