name: Unity PR Artifact Comment

on:
  workflow_run:
    workflows:
      - Unity Source Validation
    types:
      - completed

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: >-
    unity-pr-artifact-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    name: Comment artifact links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Update PR artifact comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- topiaforge-unity-pr-artifacts -->';
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            let pull = run.pull_requests?.find((item) => item.base?.ref === 'main')
              ?? run.pull_requests?.[0];

            if (!pull) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: run.head_sha,
              });
              pull = associated.data.find((item) =>
                item.state === 'open' &&
                item.head.sha === run.head_sha &&
                item.head.ref === run.head_branch &&
                item.head.repo?.full_name === run.head_repository?.full_name
              );
            }

            if (!pull) {
              core.info(`No pull request is associated with workflow run ${run.id}.`);
              return;
            }

            const currentPull = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pull.number,
            });
            if (currentPull.data.state !== 'open') {
              core.info(`Pull request #${pull.number} is no longer open; skipping artifact comment.`);
              return;
            }
            if (
              currentPull.data.head.sha !== run.head_sha ||
              currentPull.data.head.ref !== run.head_branch ||
              currentPull.data.head.repo?.full_name !== run.head_repository?.full_name
            ) {
              core.info(
                `Workflow run ${run.id} no longer matches pull request #${pull.number}; ` +
                'skipping a stale or ambiguous artifact comment.',
              );
              return;
            }
            pull = currentPull.data;

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });

            const wanted = [
              ['topiaforge-vpm-index', 'VPM package listing'],
            ];

            const rows = wanted.map(([name, label]) => {
              const artifact = artifacts.find((item) => item.name === name && !item.expired);
              if (!artifact) {
                return `| ${label} | Not produced in this run |`;
              }
              const url = `https://github.com/${owner}/${repo}/actions/runs/${run.id}/artifacts/${artifact.id}`;
              return `| ${label} | [Download artifact](${url}) |`;
            });

            const body = [
              marker,
              'Unity PR artifacts are ready.',
              '',
              '| Artifact | Link |',
              '| --- | --- |',
              ...rows,
              '',
              `Workflow run: [${run.name} #${run.run_number}](${run.html_url})`,
              `Commit: \`${run.head_sha.slice(0, 7)}\``,
              '',
              'Artifacts are temporary and expire according to the workflow retention policy.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pull.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull.number,
                body,
              });
            }
