name: Validate registry entries

# Fork-safe by design: read-only permissions and no secrets, so community
# registry PRs get full validation (download + sha + manifest checks) without
# any trust decision.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Required / Registry validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: "3.12.2"

      - name: Restore CLI packages
        working-directory: apps/topiaforge_cli
        run: dart pub get --enforce-lockfile

      # Validates every published version, package hash, packaged manifest,
      # dependency range, and declared license file IN registry/. Note that
      # registry/ deliberately holds no entries for v1: community intake is
      # closed and first-party entries are release-generated at Pages deploy
      # (see registry/README.md). So today this step passes over an empty set by
      # design - it is the gate that catches a community entry added by PR, not
      # a check on the published first-party registry. That one is asserted in
      # deploy-pages.yml, which compares the served index against the count
      # generation produced. Fork-safe: no secrets, token not persisted.
      - name: Validate registry entries
        working-directory: apps/topiaforge_cli
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/previous-registry"
          mkdir -p "$previous"
          if [[ -n "$BASE_SHA" ]]; then
            git -C ../.. archive "$BASE_SHA" registry | tar -x -C "$previous"
          fi
          dart run topiaforge registry validate \
            --entries ../../registry \
            --mods ../../mods \
            --publication \
            --previous-entries "$previous/registry"
