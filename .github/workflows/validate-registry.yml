name: Validate registry entries

# Fork-safe by design: read-only permissions and no secrets, so community
# registry PRs get full validation (download + sha + manifest checks) without
# any trust decision.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Required / Registry validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: "3.12.2"

      - name: Restore CLI packages
        working-directory: apps/topiaforge_cli
        run: dart pub get --enforce-lockfile

      # Validate every published version, package hash, packaged manifest,
      # dependency range, and declared license file. This remains fork-safe:
      # it receives no secrets and the checkout token is not persisted.
      - name: Validate registry entries
        working-directory: apps/topiaforge_cli
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/previous-registry"
          mkdir -p "$previous"
          if [[ -n "$BASE_SHA" ]]; then
            git -C ../.. archive "$BASE_SHA" registry | tar -x -C "$previous"
          fi
          dart run topiaforge registry validate \
            --entries ../../registry \
            --mods ../../mods \
            --publication \
            --previous-entries "$previous/registry"
