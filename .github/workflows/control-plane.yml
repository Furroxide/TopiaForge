name: Control plane

# Keep the pre-migration control-plane source tested until it is removed from this repository.
# Live staging and production deploys run from private Status main through the protected deploy-host workflow.
on:
  pull_request:
    branches:
      - main
      - dev
      - "release/**"
    paths:
      - "services/control-plane/**"
      - "tests/fixtures/multiplayer/**"
      - ".github/workflows/control-plane.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "services/control-plane/**"
      - "tests/fixtures/multiplayer/**"
      - ".github/workflows/control-plane.yml"
permissions:
  contents: read

# A newer validation run may supersede an older one.
concurrency:
  group: control-plane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and dry-run the control plane
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: services/control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: services/control-plane/package-lock.json

      - name: Verify pinned runtime
        run: test "$(node --version)" = v24.16.0

      - name: Restore pinned packages
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type-check and test
        env:
          CI: true
        run: npm test

      - name: Dry-run both deployments
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/control-plane-staging" --env staging
          npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/control-plane-production" --env production
