name: Prepare signed release draft

on:
  workflow_dispatch:

permissions:
  contents: read

# Publication is globally serialized. A release must be dispatched from the
# already-created protected annotated tag, never from a branch or PR event.
concurrency:
  group: topiaforge-release-publication
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  verify-candidate:
    name: Verify protected release evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      target_sha: ${{ steps.metadata.outputs.target_sha }}
      notes_file: ${{ steps.metadata.outputs.notes_file }}
      release_head_sha: ${{ steps.evidence.outputs.release_head_sha }}
      release_pr_number: ${{ steps.evidence.outputs.release_pr_number }}
    steps:
      - name: Reject non-tag dispatches
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          [[ "$GITHUB_REF" == refs/tags/v* ]]

      - name: Checkout exact protected tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Set up Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: "3.11.1"

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.301"

      - name: Restore release validator
        working-directory: apps/topiaforge_cli
        run: dart pub get --enforce-lockfile

      - name: Resolve exact catalog entry
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -er '.versioning.productVersion' release/release-policy.json)
          entry=$(jq -ec \
            --arg version "$version" \
            '[.releases[] | select(.version == $version)] |
             select(length == 1) | .[0]' release/catalog.json)
          tag=$(jq -er '.tag' <<<"$entry")
          notes_file=$(jq -er '.notesFile' <<<"$entry")
          target_sha=$(git rev-parse HEAD)
          test "$tag" = "$GITHUB_REF_NAME"
          test -s "$notes_file"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "target_sha=$target_sha"
            echo "notes_file=$notes_file"
          } >>"$GITHUB_OUTPUT"

      - name: Enforce complete release policy and provenance
        working-directory: apps/topiaforge_cli
        run: >-
          dart run topiaforge release validate-policy
          --version "${{ steps.metadata.outputs.version }}"

      - name: Require the pinned game build to still be latest
        shell: pwsh
        run: >-
          ./tools/restore-robotopia-managed-refs.ps1
          -Source public -Probe -RequireLatest

      - name: Verify tag, release PR, and exact-SHA gates
        id: evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./tools/verify-release-candidate.sh
          "$GITHUB_REPOSITORY"
          "${{ steps.metadata.outputs.tag }}"
          "${{ steps.metadata.outputs.version }}"
          "${{ steps.metadata.outputs.target_sha }}"

  build-packages:
    name: Build signed release candidates
    needs: verify-candidate
    permissions:
      contents: read
    uses: ./.github/workflows/release-signed-package-build.yml
    with:
      source_sha: ${{ needs.verify-candidate.outputs.target_sha }}
      artifact_retention_days: 30

  prepare-draft:
    name: Attest and reconcile release draft
    needs: [verify-candidate, build-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    environment:
      name: release
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          lfs: true
          persist-credentials: false
          ref: ${{ needs.verify-candidate.outputs.target_sha }}

      - name: Set up Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: "3.11.1"

      - name: Restore release metadata builder
        working-directory: apps/topiaforge_cli
        run: dart pub get --enforce-lockfile

      - name: Download signed platform archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          pattern: TopiaForge-*.zip
          merge-multiple: true

      - name: Download canonical mod packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mod-packages
          path: release-assets

      - name: Generate and verify BOM, SBOM, and checksums
        working-directory: apps/topiaforge_cli
        run: |
          set -euo pipefail
          dart run topiaforge release build-metadata \
            --version "${{ needs.verify-candidate.outputs.version }}" \
            --target-sha "${{ needs.verify-candidate.outputs.target_sha }}" \
            --assets ../../release-assets
          dart run topiaforge release verify-metadata \
            --version "${{ needs.verify-candidate.outputs.version }}" \
            --target-sha "${{ needs.verify-candidate.outputs.target_sha }}" \
            --assets ../../release-assets

      - name: Attest all release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/*

      - name: Create or resume matching draft without tag mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./tools/publish-release-draft.sh
          "$GITHUB_REPOSITORY"
          "${{ needs.verify-candidate.outputs.tag }}"
          "${{ needs.verify-candidate.outputs.target_sha }}"
          "TopiaForge ${{ needs.verify-candidate.outputs.version }}"
          "${{ needs.verify-candidate.outputs.notes_file }}"
          release-assets

      - name: Explain the manual publication boundary
        run: |
          echo 'A signed, attested, verified draft was prepared from the protected tag.'
          echo 'An authorized owner must inspect the draft and publish it manually.'
          echo 'Immutable releases lock the tag and assets at publication.'
