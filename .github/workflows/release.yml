name: Build release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update when running manually"
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  macos-cli-x64:
    name: Build macOS x64 CLI
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Build x64 CLI
        working-directory: apps/robotopia_cli
        run: |
          dart pub get
          dart compile exe bin/robotopia.dart -o "$RUNNER_TEMP/robotopia-macos-x64"
          chmod +x "$RUNNER_TEMP/robotopia-macos-x64"

      - name: Upload x64 CLI
        uses: actions/upload-artifact@v4
        with:
          name: robotopia-macos-x64
          path: ${{ runner.temp }}/robotopia-macos-x64
          if-no-files-found: error

  build:
    name: Build ${{ matrix.platform }} package
    needs: macos-cli-x64
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            asset: QuantumWorks-windows-x64.zip
          - platform: linux
            runner: ubuntu-latest
            asset: QuantumWorks-linux-x64.zip
          - platform: macos
            runner: macos-15
            asset: QuantumWorks-macos-universal.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev zip unzip

      - name: Restore Robotopia managed refs
        shell: pwsh
        env:
          ROBOTOPIA_REFS_URL: ${{ secrets.ROBOTOPIA_REFS_URL }}
          ROBOTOPIA_REFS_SHA256: ${{ secrets.ROBOTOPIA_REFS_SHA256 }}
          ROBOTOPIA_REFS_TOKEN: ${{ secrets.ROBOTOPIA_REFS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ROBOTOPIA_REFS_URL)) {
            throw "ROBOTOPIA_REFS_URL secret is required."
          }
          if ([string]::IsNullOrWhiteSpace($env:ROBOTOPIA_REFS_SHA256)) {
            throw "ROBOTOPIA_REFS_SHA256 secret is required."
          }

          $archive = Join-Path $env:RUNNER_TEMP "robotopia-managed-refs.zip"
          $headers = @{}
          if (![string]::IsNullOrWhiteSpace($env:ROBOTOPIA_REFS_TOKEN)) {
            $headers["Authorization"] = "Bearer $env:ROBOTOPIA_REFS_TOKEN"
          }
          Invoke-WebRequest -Uri $env:ROBOTOPIA_REFS_URL -Headers $headers -OutFile $archive

          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = $env:ROBOTOPIA_REFS_SHA256.Trim().ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Robotopia refs SHA-256 mismatch. Expected $expected but got $actual."
          }

          $extract = Join-Path $env:RUNNER_TEMP "robotopia-managed-refs"
          Expand-Archive -LiteralPath $archive -DestinationPath $extract -Force
          $unity = Get-ChildItem -LiteralPath $extract -Recurse -Filter "UnityEngine.dll" -File |
            Select-Object -First 1
          if ($null -eq $unity) {
            throw "Reference archive did not contain UnityEngine.dll."
          }
          $managed = Split-Path $unity.FullName -Parent
          "RobotopiaManagedDir=$managed" >> $env:GITHUB_ENV
          Write-Host "RobotopiaManagedDir=$managed"

      # Proves the Dart-native scaffold + pack pipeline works on every OS before it feeds the release payload.
      # Scaffolds inside the checkout (not RUNNER_TEMP) so the generated ProjectReference to
      # src/Robotopia.Mods.Abstractions stays a same-drive relative path on Windows runners.
      - name: Smoke test CLI scaffold and pack
        shell: bash
        working-directory: apps/robotopia_cli
        run: |
          dart pub get
          dart run bin/robotopia.dart new mod ci.smoke --name "CI Smoke" --dir ../../.pack-smoke
          dart run bin/robotopia.dart pack --project ../../.pack-smoke/ci.smoke --output "$RUNNER_TEMP/pack-smoke"

      - name: Prepare macOS universal CLI
        if: matrix.platform == 'macos'
        uses: actions/download-artifact@v4
        with:
          name: robotopia-macos-x64
          path: ${{ runner.temp }}/macos-x64-cli

      - name: Combine macOS CLI architectures
        if: matrix.platform == 'macos'
        shell: bash
        working-directory: apps/robotopia_cli
        run: |
          dart pub get
          dart compile exe bin/robotopia.dart -o "$RUNNER_TEMP/robotopia-macos-arm64"
          chmod +x "$RUNNER_TEMP/robotopia-macos-arm64"
          chmod +x "$RUNNER_TEMP/macos-x64-cli/robotopia-macos-x64"
          lipo -create \
            "$RUNNER_TEMP/macos-x64-cli/robotopia-macos-x64" \
            "$RUNNER_TEMP/robotopia-macos-arm64" \
            -output "$RUNNER_TEMP/robotopia-macos-universal"
          chmod +x "$RUNNER_TEMP/robotopia-macos-universal"
          lipo -archs "$RUNNER_TEMP/robotopia-macos-universal"

      - name: Build release package
        shell: pwsh
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          $args = @(
            "-Platform", "${{ matrix.platform }}",
            "-OutputRoot", (Join-Path $env:GITHUB_WORKSPACE "release-artifacts"),
            "-Configuration", "Release"
          )
          if ("${{ matrix.platform }}" -eq "macos") {
            $args += @("-PrebuiltCli", (Join-Path $env:RUNNER_TEMP "robotopia-macos-universal"))
          }
          & ./tools/package-distribution.ps1 @args

      - name: Smoke test release package
        shell: pwsh
        run: |
          $args = @(
            "-Platform", "${{ matrix.platform }}",
            "-ZipPath", (Join-Path (Join-Path $env:GITHUB_WORKSPACE "release-artifacts") "${{ matrix.asset }}")
          )
          if ("${{ matrix.platform }}" -eq "macos") {
            $args += "-RequireMacUniversal"
          }
          & ./tools/test-release-package.ps1 @args

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-artifacts/${{ matrix.asset }}
          if-no-files-found: error

      # One canonical byte-set for the mod registry: per-platform packs are
      # byte-different, so only the linux leg's dist/ feeds the release assets
      # the registry index hashes and links.
      - name: Upload mod packages artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: mod-packages
          path: dist/*.robotopiamod
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release-tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            tag="${{ inputs.tag }}"
          fi
          if [[ -z "$tag" ]]; then
            echo "Release tag is required." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: QuantumWorks-*.zip
          merge-multiple: true

      - name: Download mod packages
        uses: actions/download-artifact@v4
        with:
          name: mod-packages
          path: mod-packages

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release-tag.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "QuantumWorks release $TAG"
          fi
          gh release upload "$TAG" release-assets/*.zip --clobber
          # Standalone mod packages back the registry index's download URLs.
          gh release upload "$TAG" mod-packages/*.robotopiamod --clobber

  deploy-index:
    name: Deploy launcher update + mod registry indexes
    needs: publish-release
    runs-on: ubuntu-latest
    # A Pages deploy replaces the whole site, so every deploy (here and in
    # deploy-launcher-updates.yml) must build BOTH indexes, and the two
    # workflows serialize on the shared "pages" group.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Restore CLI packages
        working-directory: apps/robotopia_cli
        run: dart pub get

      - name: Build launcher update index
        working-directory: apps/robotopia_cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAUNCHER_UPDATE_BASE_URL: ${{ vars.LAUNCHER_UPDATE_BASE_URL }}
        run: dart run robotopia updates index --repository "$GITHUB_REPOSITORY" --output "../../_site"

      - name: Build mod registry index
        working-directory: apps/robotopia_cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dart run robotopia registry index
          --repository "$GITHUB_REPOSITORY"
          --entries ../../registry
          --changelogs ../../mods
          --output ../../_site/registry

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
