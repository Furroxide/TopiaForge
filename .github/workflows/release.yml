name: Publish release packages

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  preflight:
    name: Verify release inputs
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - name: Check required release secrets
        shell: bash
        env:
          ROBOTOPIA_REFS_URL: ${{ secrets.ROBOTOPIA_REFS_URL }}
          ROBOTOPIA_REFS_SHA256: ${{ secrets.ROBOTOPIA_REFS_SHA256 }}
        run: |
          missing=()
          if [[ -z "${ROBOTOPIA_REFS_URL}" ]]; then
            missing+=("ROBOTOPIA_REFS_URL")
          fi
          if [[ -z "${ROBOTOPIA_REFS_SHA256}" ]]; then
            missing+=("ROBOTOPIA_REFS_SHA256")
          fi

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Release publishing requires managed-reference repo secrets: ${missing[*]}. macOS signing and notarization secrets are optional."
            exit 1
          fi

  release-metadata:
    name: Resolve release metadata
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      target_sha: ${{ steps.metadata.outputs.target_sha }}
    steps:
      - name: Checkout merged release
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Checkout workflow ref
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release versions
        id: metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          read_version() {
            awk -F': *' '$1 == "version" { print $2; exit }' "$1" |
              tr -d '"' |
              tr -d "'"
          }

          release_version="$(read_version apps/robotopia_cli/pubspec.yaml)"
          if [[ -z "$release_version" ]]; then
            echo "::error::Could not read apps/robotopia_cli/pubspec.yaml version."
            exit 1
          fi
          release_base="${release_version%%+*}"

          check_version() {
            local file="$1"
            local version
            version="$(read_version "$file")"
            local base="${version%%+*}"
            if [[ "$base" != "$release_base" ]]; then
              echo "::error::$file version '$version' does not match release version '$release_base'."
              exit 1
            fi
          }

          check_version apps/robotopia_launcher_flutter/pubspec.yaml
          check_version packages/launcher_domain/pubspec.yaml
          check_version packages/launcher_data/pubspec.yaml
          check_version packages/launcher_ui/pubspec.yaml

          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" != "release/$release_base" ]]; then
            echo "::error::Merged release PR branch '$HEAD_REF' must be release/$release_base."
            exit 1
          fi

          tag="v$release_base"
          target_sha="$(git rev-parse HEAD)"
          echo "version=$release_base" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved $tag at $target_sha."

  build-packages:
    name: Build release packages
    needs: release-metadata
    uses: ./.github/workflows/release-package-build.yml
    with:
      fail_on_missing_refs: true
      artifact_retention_days: 30
    secrets:
      ROBOTOPIA_REFS_URL: ${{ secrets.ROBOTOPIA_REFS_URL }}
      ROBOTOPIA_REFS_SHA256: ${{ secrets.ROBOTOPIA_REFS_SHA256 }}
      ROBOTOPIA_REFS_TOKEN: ${{ secrets.ROBOTOPIA_REFS_TOKEN }}
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
      MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
      MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}

  publish-release:
    name: Publish GitHub Release assets
    needs:
      - release-metadata
      - build-packages
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.release-metadata.outputs.tag }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.release-metadata.outputs.target_sha }}

      - name: Create or validate release tag
        shell: bash
        env:
          TAG: ${{ needs.release-metadata.outputs.tag }}
          TARGET_SHA: ${{ needs.release-metadata.outputs.target_sha }}
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            actual_sha="$(git rev-list -n 1 "$TAG")"
            if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
              echo "::error::$TAG points at $actual_sha, expected $TARGET_SHA."
              exit 1
            fi
            echo "$TAG already points at $TARGET_SHA."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "QuantumWorks ${TAG#v}" "$TARGET_SHA"
          git push origin "refs/tags/$TAG"

      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: QuantumWorks-*.zip
          merge-multiple: true

      - name: Download mod packages
        uses: actions/download-artifact@v4
        with:
          name: mod-packages
          path: mod-packages

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-metadata.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "QuantumWorks release $TAG"
          fi
          gh release upload "$TAG" release-assets/*.zip --clobber
          # Standalone mod packages back the registry index's download URLs.
          gh release upload "$TAG" mod-packages/*.robotopiamod --clobber

  deploy-index:
    name: Deploy launcher update + mod registry indexes
    needs:
      - release-metadata
      - publish-release
    runs-on: ubuntu-latest
    # A Pages deploy replaces the whole site, so every deploy (here and in
    # deploy-launcher-updates.yml) must build BOTH indexes, and the two
    # workflows serialize on the shared "pages" group.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.target_sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Restore CLI packages
        working-directory: apps/robotopia_cli
        run: dart pub get

      - name: Build launcher update index
        working-directory: apps/robotopia_cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAUNCHER_UPDATE_BASE_URL: ${{ vars.LAUNCHER_UPDATE_BASE_URL }}
        run: dart run robotopia updates index --repository "$GITHUB_REPOSITORY" --output "../../_site"

      - name: Build mod registry index
        working-directory: apps/robotopia_cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dart run robotopia registry index
          --repository "$GITHUB_REPOSITORY"
          --entries ../../registry
          --changelogs ../../mods
          --output ../../_site/registry

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
