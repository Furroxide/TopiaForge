name: Finalize verified release

run-name: Finalize ${{ inputs.tag }} (${{ inputs.request_id }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed annotated version tag to finalize
        required: true
        type: string
      request_id:
        description: Unique release-admin dispatch request identifier
        required: true
        type: string

permissions:
  contents: read

# Publication is globally serialized. A release must be dispatched from the
# already-created protected annotated tag, never from a branch or PR event.
concurrency:
  group: topiaforge-release-publication
  cancel-in-progress: false

env:
  DART_SUPPRESS_ANALYTICS: true
  TOPIAFORGE_VERIFICATION_PREDICATE: https://topiaforge.dev/attestations/release-verification/v1

jobs:
  verify-candidate:
    name: Verify protected release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      target_sha: ${{ steps.metadata.outputs.target_sha }}
      notes_file: ${{ steps.metadata.outputs.notes_file }}
      platform_matrix: ${{ steps.metadata.outputs.platform_matrix }}
      release_head_sha: ${{ steps.evidence.outputs.release_head_sha }}
      release_pr_number: ${{ steps.evidence.outputs.release_pr_number }}
    steps:
      - name: Reject non-version-tag dispatches
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = tag
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$DISPATCH_TAG" = "$GITHUB_REF_NAME"
          [[ "$DISPATCH_REQUEST_ID" =~ ^release-admin-[0-9a-f]{32}$ ]]

      - name: Checkout exact protected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: "3.12.2"

      - name: Restore release validator
        working-directory: apps/topiaforge_cli
        run: dart pub get --enforce-lockfile

      - name: Resolve exact catalog entry
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -er '.versioning.productVersion' release/release-policy.json)
          entry=$(jq -ec \
            --arg version "$version" \
            '[.releases[] | select(.version == $version)] |
             select(length == 1) | .[0]' release/catalog.json)
          tag=$(jq -er '.tag' <<<"$entry")
          prerelease=$(jq -er '.prerelease | select(type == "boolean")' <<<"$entry")
          notes_file=$(jq -er '.notesFile' <<<"$entry")
          target_sha=$(git rev-parse HEAD)
          test "$tag" = "$GITHUB_REF_NAME"
          expected_notes_file="release/notes/$tag.md"
          [[ "$notes_file" != *$'\r'* && "$notes_file" != *$'\n'* ]]
          [[ "$notes_file" != /* && "$notes_file" != *\\* ]]
          [[ "/$notes_file/" != *"/../"* && "/$notes_file/" != *"/./"* ]]
          test "$notes_file" = "$expected_notes_file"
          test -s "$notes_file"
          # The platform set is the policy's, not the workflow's. RC1 is
          # Windows-only, so hard-coding a Linux leg here made `finalize`
          # demand a bundle `artifactPolicy` never asks anyone to build.
          platform_matrix=$(jq -ec '
            [
              .artifactPolicy.platformArchives[] |
              (
                if . == "TopiaForge-windows-x64.zip" then
                  {platform: "windows", target: "windows-x64",
                   runner: "windows-2025"}
                elif . == "TopiaForge-linux-x64.zip" then
                  {platform: "linux", target: "linux-x64",
                   runner: "ubuntu-24.04"}
                else
                  error("Unsupported release platform archive: " + .)
                end
              ) + {archive: .}
            ] |
            select(length >= 1) |
            {include: .}
          ' release/release-policy.json)
          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
            printf 'prerelease=%s\n' "$prerelease"
            printf 'target_sha=%s\n' "$target_sha"
            printf 'notes_file=%s\n' "$notes_file"
            printf 'platform_matrix=%s\n' "$platform_matrix"
          } >>"$GITHUB_OUTPUT"

      - name: Enforce complete release policy
        working-directory: apps/topiaforge_cli
        run: >-
          dart run bin/topiaforge.dart release validate-policy
          --version "${{ steps.metadata.outputs.version }}"

      - name: Verify exact release readiness decision
        working-directory: apps/topiaforge_cli
        run: >-
          dart run bin/topiaforge.dart release validate-readiness
          --version "${{ steps.metadata.outputs.version }}"
          --target-sha "${{ steps.metadata.outputs.target_sha }}"

      - name: Verify tag, exact release PR, and hosted checks
        id: evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./tools/verify-release-candidate.sh
          "$GITHUB_REPOSITORY"
          "${{ steps.metadata.outputs.tag }}"
          "${{ steps.metadata.outputs.version }}"
          "${{ steps.metadata.outputs.target_sha }}"

  verify-platform-bundles:
    name: Verify ${{ matrix.platform }} production bytes
    needs: verify-candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-candidate.outputs.platform_matrix) }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Pin the checkout to the approved release commit
        shell: bash
        env:
          TARGET_SHA: ${{ needs.verify-candidate.outputs.target_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.301"

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: "3.12.2"

      - name: Restore package verifier
        working-directory: apps/topiaforge_cli
        run: dart pub get --enforce-lockfile

      - name: Fetch exact admin-staged release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash ./tools/fetch-release-assets.sh
          "$GITHUB_REPOSITORY"
          "${{ needs.verify-candidate.outputs.tag }}"
          "${{ needs.verify-candidate.outputs.target_sha }}"
          "TopiaForge ${{ needs.verify-candidate.outputs.version }}"
          "${{ needs.verify-candidate.outputs.notes_file }}"
          staged-assets
          "${{ needs.verify-candidate.outputs.prerelease }}"

      - name: Verify authenticated admin handoff
        shell: pwsh
        run: |
          $policy = Get-Content -LiteralPath (
            Join-Path $env:GITHUB_WORKSPACE "release/release-policy.json"
          ) -Raw | ConvertFrom-Json
          if ($policy.publication.PSObject.Properties.Name -contains
              "codeSigningException") {
            throw "Production handoffs forbid every code-signing exception."
          }
          $windowsDistribution = "signed"
          if ($policy.signingIdentities.PSObject.Properties.Name -contains
              "windowsDistribution") {
            $windowsDistribution =
              [string]$policy.signingIdentities.windowsDistribution
          }
          if ($windowsDistribution -cne "signed" -and
              $windowsDistribution -cne "unsigned") {
            throw "Unknown Windows distribution mode '$windowsDistribution'."
          }
          $signaturePath = Join-Path $env:GITHUB_WORKSPACE `
            "staged-assets/release-handoff-v1.json.p7s"
          if ($windowsDistribution -ceq "unsigned") {
            # Read from the policy at the verified target SHA, so the mode is a
            # property of the reviewed candidate and not of what the admin chose
            # to upload. An unsigned distribution has no certificate, therefore
            # no detached CMS handoff signature; a staged P7S here would mean the
            # staged assets disagree with the policy.
            if (Test-Path -LiteralPath $signaturePath) {
              throw "An unsigned distribution must not stage a handoff signature."
            }
            Write-Host "Unsigned distribution: no detached CMS handoff to verify."
          }
          else {
            $expectedSigner = [string](
              $policy.signingIdentities.windowsCertificateSha256
            )
            if ($expectedSigner -cnotmatch "^(?!0{64}$)[0-9a-f]{64}$") {
              throw "A reviewed Windows signer certificate SHA-256 is required."
            }
            & pwsh -NoLogo -NoProfile -NonInteractive -File (
              Join-Path $env:GITHUB_WORKSPACE
                "tools/release/handoff-signature.ps1"
            ) -Mode Verify `
              -ExpectedCertificateSha256 $expectedSigner `
              -HandoffPath (
                Join-Path $env:GITHUB_WORKSPACE
                  "staged-assets/release-handoff-v1.json"
              ) `
              -SignaturePath $signaturePath
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticated admin handoff verification failed."
            }
          }

      - name: Verify handoff claims against exact bytes
        id: handoff
        working-directory: apps/topiaforge_cli
        shell: bash
        run: |
          set -euo pipefail
          dart run bin/topiaforge.dart release verify-handoff \
            --version "${{ needs.verify-candidate.outputs.version }}" \
            --target-sha "${{ needs.verify-candidate.outputs.target_sha }}" \
            --assets "$GITHUB_WORKSPACE/staged-assets" \
            --verify-embedded-ecosystem
          canonical_sha256=$(jq -er '.canonicalEcosystemSha256' \
            "$GITHUB_WORKSPACE/staged-assets/release-handoff-v1.json")
          echo "canonical_sha256=$canonical_sha256" >>"$GITHUB_OUTPUT"

      - name: Verify Windows package trust state
        if: matrix.platform == 'windows'
        working-directory: apps/topiaforge_cli
        env:
          CANONICAL_ECOSYSTEM_SHA256: ${{ steps.handoff.outputs.canonical_sha256 }}
        shell: pwsh
        run: |
          $policy = Get-Content -LiteralPath (
            Join-Path $env:GITHUB_WORKSPACE "release/release-policy.json"
          ) -Raw | ConvertFrom-Json
          if ($policy.publication.PSObject.Properties.Name -contains
              "codeSigningException") {
            throw "Production Windows packages forbid signing exceptions."
          }
          $windowsDistribution = "signed"
          if ($policy.signingIdentities.PSObject.Properties.Name -contains
              "windowsDistribution") {
            $windowsDistribution =
              [string]$policy.signingIdentities.windowsDistribution
          }
          if ($windowsDistribution -cne "signed" -and
              $windowsDistribution -cne "unsigned") {
            throw "Unknown Windows distribution mode '$windowsDistribution'."
          }
          $arguments = @(
            "run", "bin/topiaforge.dart", "release", "test-package",
            "--platform", "windows",
            "--zip",
              "$env:GITHUB_WORKSPACE/staged-assets/${{ matrix.archive }}",
            "--expected-canonical-ecosystem-sha256",
              "$env:CANONICAL_ECOSYSTEM_SHA256",
            "--canonical-assets", "$env:GITHUB_WORKSPACE/staged-assets",
            "--run-embedded-cli"
          )
          if ($windowsDistribution -ceq "unsigned") {
            # Assert the artifacts really are unsigned. Without this an unsigned
            # policy would simply stop checking, and a package signed by stray
            # credentials would pass unnoticed.
            $arguments += "--require-windows-unsigned"
          }
          else {
            $expectedSigner = [string](
              $policy.signingIdentities.windowsCertificateSha256
            )
            if ($expectedSigner -cnotmatch "^(?!0{64}$)[0-9a-f]{64}$") {
              throw "A reviewed Windows signer certificate SHA-256 is required."
            }
            $arguments += @(
              "--require-windows-signature",
              "--expected-windows-signer-sha256", $expectedSigner
            )
          }
          & dart @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Windows package trust verification failed."
          }

      - name: Verify Linux package
        if: matrix.platform == 'linux'
        working-directory: apps/topiaforge_cli
        env:
          CANONICAL_ECOSYSTEM_SHA256: ${{ steps.handoff.outputs.canonical_sha256 }}
        run: >-
          dart run bin/topiaforge.dart release test-package
          --platform linux
          --zip "$GITHUB_WORKSPACE/staged-assets/${{ matrix.archive }}"
          --expected-canonical-ecosystem-sha256
          "$CANONICAL_ECOSYSTEM_SHA256"
          --canonical-assets "$GITHUB_WORKSPACE/staged-assets"
          --run-embedded-cli

      - name: Record deterministic hosted verification evidence
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE: ${{ matrix.archive }}
          TARGET_SHA: ${{ needs.verify-candidate.outputs.target_sha }}
          VERSION: ${{ needs.verify-candidate.outputs.version }}
          TAG: ${{ needs.verify-candidate.outputs.tag }}
        run: |
          set -euo pipefail
          sha256_file() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }
          archive_path="staged-assets/$ARCHIVE"
          archive_sha=$(sha256_file "$archive_path")
          archive_size=$(wc -c <"$archive_path" | tr -d ' ')
          handoff_sha=$(sha256_file staged-assets/release-handoff-v1.json)
          windows_distribution=$(jq -er '
            .signingIdentities.windowsDistribution // "signed"
          ' release/release-policy.json | tr -d '\r')
          case "$windows_distribution" in
            signed|unsigned) ;;
            *) echo "Unknown Windows distribution mode: $windows_distribution" >&2; exit 1 ;;
          esac
          # An unsigned distribution produces no detached CMS handoff, so the field is
          # omitted rather than emitted empty. An absent field cannot be mistaken for a
          # signature that was present and went unverified; "" reads like both.
          if [ "$windows_distribution" = unsigned ]; then
            handoff_signature_json=null
          else
            handoff_signature_json=$(
              jq -n --arg sha "$(sha256_file staged-assets/release-handoff-v1.json.p7s)" '$sha'
            )
          fi
          trust_check=$(
            case "$PLATFORM" in
              windows)
                if [ "$windows_distribution" = unsigned ]; then
                  echo unsigned
                else
                  echo authenticode
                fi
                ;;
              linux) echo not-applicable ;;
              *) exit 1 ;;
            esac
          )
          jq -S -n \
            --arg platform "$PLATFORM" \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg targetSha "$TARGET_SHA" \
            --arg archiveName "$ARCHIVE" \
            --arg archiveSha256 "$archive_sha" \
            --argjson archiveSize "$archive_size" \
            --arg handoffSha256 "$handoff_sha" \
            --argjson handoffSignatureSha256 "$handoff_signature_json" \
            --arg trustCheck "$trust_check" \
            '{
              schema: "release-hosted-verification-v1",
              platform: $platform,
              version: $version,
              tag: $tag,
              targetSha: $targetSha,
              archive: {
                name: $archiveName,
                sha256: $archiveSha256,
                size: $archiveSize
              },
              handoffSha256: $handoffSha256
            }
            + (if $handoffSignatureSha256 == null then {}
               else {handoffSignatureSha256: $handoffSignatureSha256} end)
            + {
              packageValidation: "passed",
              trustCheck: $trustCheck,
              result: "passed"
            }' >"hosted-verification-$PLATFORM.json"

      - name: Preserve hosted verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-verification-${{ matrix.platform }}
          path: hosted-verification-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 7

  finalize:
    name: Verify, attest, and publish
    needs: [verify-candidate, verify-platform-bundles]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      pull-requests: read
      security-events: read
    environment:
      name: release
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
          ref: ${{ needs.verify-candidate.outputs.target_sha }}

      - name: Verify critical live release governance after approval
        env:
          GH_TOKEN: ${{ secrets.TOPIAFORGE_GOVERNANCE_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          bash ./tools/verify-release-governance.sh "$GITHUB_REPOSITORY"

      - name: Audit complete live repository governance after approval
        env:
          GH_TOKEN: ${{ secrets.TOPIAFORGE_GOVERNANCE_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python3 .github/scripts/audit_repository_governance.py \
            check \
            --repo "$GITHUB_REPOSITORY"

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.301"

      - name: Set up Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # v1.8.0
        with:
          sdk: "3.12.2"

      - name: Restore release verifier
        working-directory: apps/topiaforge_cli
        run: dart pub get --enforce-lockfile

      - name: Revalidate candidate after protected approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./tools/verify-release-candidate.sh
          "$GITHUB_REPOSITORY"
          "${{ needs.verify-candidate.outputs.tag }}"
          "${{ needs.verify-candidate.outputs.version }}"
          "${{ needs.verify-candidate.outputs.target_sha }}"

      - name: Revalidate exact release readiness after approval
        working-directory: apps/topiaforge_cli
        run: >-
          dart run bin/topiaforge.dart release validate-readiness
          --version "${{ needs.verify-candidate.outputs.version }}"
          --target-sha "${{ needs.verify-candidate.outputs.target_sha }}"

      - name: Fetch exact admin-staged release assets
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          bash ./tools/fetch-release-assets.sh
          "$GITHUB_REPOSITORY"
          "${{ needs.verify-candidate.outputs.tag }}"
          "${{ needs.verify-candidate.outputs.target_sha }}"
          "TopiaForge ${{ needs.verify-candidate.outputs.version }}"
          "${{ needs.verify-candidate.outputs.notes_file }}"
          staged-assets
          "${{ needs.verify-candidate.outputs.prerelease }}"

      - name: Verify authenticated admin handoff
        shell: pwsh
        run: |
          $policy = Get-Content -LiteralPath (
            Join-Path $env:GITHUB_WORKSPACE "release/release-policy.json"
          ) -Raw | ConvertFrom-Json
          if ($policy.publication.PSObject.Properties.Name -contains
              "codeSigningException") {
            throw "Production handoffs forbid every code-signing exception."
          }
          $windowsDistribution = "signed"
          if ($policy.signingIdentities.PSObject.Properties.Name -contains
              "windowsDistribution") {
            $windowsDistribution =
              [string]$policy.signingIdentities.windowsDistribution
          }
          if ($windowsDistribution -cne "signed" -and
              $windowsDistribution -cne "unsigned") {
            throw "Unknown Windows distribution mode '$windowsDistribution'."
          }
          $signaturePath = Join-Path $env:GITHUB_WORKSPACE `
            "staged-assets/release-handoff-v1.json.p7s"
          if ($windowsDistribution -ceq "unsigned") {
            # Read from the policy at the verified target SHA, so the mode is a
            # property of the reviewed candidate and not of what the admin chose
            # to upload. An unsigned distribution has no certificate, therefore
            # no detached CMS handoff signature; a staged P7S here would mean the
            # staged assets disagree with the policy.
            if (Test-Path -LiteralPath $signaturePath) {
              throw "An unsigned distribution must not stage a handoff signature."
            }
            Write-Host "Unsigned distribution: no detached CMS handoff to verify."
          }
          else {
            $expectedSigner = [string](
              $policy.signingIdentities.windowsCertificateSha256
            )
            if ($expectedSigner -cnotmatch "^(?!0{64}$)[0-9a-f]{64}$") {
              throw "A reviewed Windows signer certificate SHA-256 is required."
            }
            & pwsh -NoLogo -NoProfile -NonInteractive -File (
              Join-Path $env:GITHUB_WORKSPACE
                "tools/release/handoff-signature.ps1"
            ) -Mode Verify `
              -ExpectedCertificateSha256 $expectedSigner `
              -HandoffPath (
                Join-Path $env:GITHUB_WORKSPACE
                  "staged-assets/release-handoff-v1.json"
              ) `
              -SignaturePath $signaturePath
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticated admin handoff verification failed."
            }
          }

      - name: Verify local-build handoff and evidence
        working-directory: apps/topiaforge_cli
        run: >-
          dart run bin/topiaforge.dart release verify-handoff
          --version "${{ needs.verify-candidate.outputs.version }}"
          --target-sha "${{ needs.verify-candidate.outputs.target_sha }}"
          --assets "$GITHUB_WORKSPACE/staged-assets"
          --trust-output "$RUNNER_TEMP/platform-trust-evidence.json"
          --verify-embedded-ecosystem

      - name: Download hosted platform-verification evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hosted-verification-*
          path: hosted-verification
          merge-multiple: true

      - name: Bind hosted verification to the current draft bytes
        shell: bash
        run: |
          set -euo pipefail
          # Expect one hosted-verification record per platform the release
          # policy actually ships, not a fixed two.
          read -r -a expected_platforms <<<"$(jq -er '
            [
              .artifactPolicy.platformArchives[] |
              if . == "TopiaForge-windows-x64.zip" then "windows"
              elif . == "TopiaForge-linux-x64.zip" then "linux"
              else error("Unsupported release platform archive: " + .)
              end
            ] |
            sort | join(" ")
          ' release/release-policy.json)"
          test "${#expected_platforms[@]}" -ge 1
          test "$(
            find hosted-verification -mindepth 1 -maxdepth 1 \
              -type f -name 'hosted-verification-*.json' | wc -l
          )" -eq "${#expected_platforms[@]}"
          handoff_sha=$(sha256sum staged-assets/release-handoff-v1.json |
            awk '{print $1}')
          windows_distribution=$(jq -er '
            .signingIdentities.windowsDistribution // "signed"
          ' release/release-policy.json | tr -d '\r')
          case "$windows_distribution" in
            signed|unsigned) ;;
            *) echo "Unknown Windows distribution mode: $windows_distribution" >&2; exit 1 ;;
          esac
          # Assert the shape the mode requires in both directions: a signed release must
          # carry the signature digest, and an unsigned one must not carry the key at
          # all. Checking only the signed direction would let an unsigned candidate
          # publish evidence that silently dropped the field.
          if [ "$windows_distribution" = unsigned ]; then
            handoff_signature_filter='(has("handoffSignatureSha256") | not)'
            windows_trust=unsigned
          else
            handoff_signature_sha=$(
              sha256sum staged-assets/release-handoff-v1.json.p7s |
                awk '{print $1}'
            )
            # $handoffSignatureSha256 is a jq variable bound by --arg below, so it
            # must reach jq unexpanded. Single quotes are the point.
            # shellcheck disable=SC2016
            handoff_signature_filter='.handoffSignatureSha256 == $handoffSignatureSha256'
            windows_trust=authenticode
          fi
          declare -A seen_platforms
          for evidence in hosted-verification/hosted-verification-*.json; do
            jq -e \
              --arg version "${{ needs.verify-candidate.outputs.version }}" \
              --arg tag "${{ needs.verify-candidate.outputs.tag }}" \
              --arg targetSha "${{ needs.verify-candidate.outputs.target_sha }}" \
              --arg handoffSha256 "$handoff_sha" \
              --arg handoffSignatureSha256 "${handoff_signature_sha:-}" \
              '.schema == "release-hosted-verification-v1" and
               .version == $version and
               .tag == $tag and
               .targetSha == $targetSha and
               .handoffSha256 == $handoffSha256 and
               '"$handoff_signature_filter"' and
               .packageValidation == "passed" and
               .result == "passed"' "$evidence" >/dev/null
            platform=$(jq -er '.platform' "$evidence")
            archive=$(jq -er '.archive.name' "$evidence")
            trust_check=$(jq -er '.trustCheck' "$evidence")
            case "$platform:$archive" in
              windows:TopiaForge-windows-x64.zip)
                test "$trust_check" = "$windows_trust"
                ;;
              linux:TopiaForge-linux-x64.zip)
                test "$trust_check" = not-applicable
                ;;
              *) exit 1 ;;
            esac
            [[ -z ${seen_platforms[$platform]+x} ]]
            seen_platforms[$platform]=1
            test "$(jq -er '.archive.sha256' "$evidence")" = "$(
              sha256sum "staged-assets/$archive" | awk '{print $1}'
            )"
            test "$(jq -er '.archive.size' "$evidence")" -eq "$(
              wc -c <"staged-assets/$archive"
            )"
          done
          for expected_platform in "${expected_platforms[@]}"; do
            test "${seen_platforms[$expected_platform]:-}" = 1
          done
          test "${#seen_platforms[@]}" -eq "${#expected_platforms[@]}"

      - name: Isolate the exact catalog asset set
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          jq -er \
            --arg version "${{ needs.verify-candidate.outputs.version }}" \
            '.releases[] | select(.version == $version) | .artifacts[]' \
            release/catalog.json |
          while IFS= read -r name; do
            [[ "$name" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]
            test -f "staged-assets/$name"
            cp -- "staged-assets/$name" "release-assets/$name"
          done
          cp "$RUNNER_TEMP/platform-trust-evidence.json" \
            release-assets/.platform-trust-evidence.json

      - name: Generate and verify signed update metadata
        working-directory: apps/topiaforge_cli
        env:
          TOPIAFORGE_UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.TOPIAFORGE_UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          dart run bin/topiaforge.dart release build-update-metadata \
            --version "${{ needs.verify-candidate.outputs.version }}" \
            --assets "$GITHUB_WORKSPACE/release-assets"
          dart run bin/topiaforge.dart release verify-update-metadata \
            --version "${{ needs.verify-candidate.outputs.version }}" \
            --assets "$GITHUB_WORKSPACE/release-assets"

      - name: Generate and verify deterministic BOM, SBOM, and checksums
        working-directory: apps/topiaforge_cli
        run: |
          set -euo pipefail
          dart run bin/topiaforge.dart release build-metadata \
            --version "${{ needs.verify-candidate.outputs.version }}" \
            --target-sha "${{ needs.verify-candidate.outputs.target_sha }}" \
            --assets "$GITHUB_WORKSPACE/release-assets"
          dart run bin/topiaforge.dart release verify-metadata \
            --version "${{ needs.verify-candidate.outputs.version }}" \
            --target-sha "${{ needs.verify-candidate.outputs.target_sha }}" \
            --assets "$GITHUB_WORKSPACE/release-assets"
          rm "$GITHUB_WORKSPACE/release-assets/.platform-trust-evidence.json"

      - name: Complete and verify final public asset inventory
        shell: bash
        run: |
          set -euo pipefail
          handoff_names=(
            release-handoff-v1.json
          )
          windows_distribution=$(jq -er '
            .signingIdentities.windowsDistribution // "signed"
          ' release/release-policy.json | tr -d '\r')
          case "$windows_distribution" in
            signed|unsigned) ;;
            *) echo "Unknown Windows distribution mode: $windows_distribution" >&2; exit 1 ;;
          esac
          if [ "$windows_distribution" != unsigned ]; then
            handoff_names+=(release-handoff-v1.json.p7s)
          fi
          while IFS= read -r bundle_name; do
            handoff_names+=("$bundle_name")
          done < <(jq -er '
            [
              .artifactPolicy.platformArchives[] |
              "release-platform-bundle-v1-" +
              (ltrimstr("TopiaForge-") | rtrimstr(".zip")) + ".json"
            ] |
            sort | .[]
          ' release/release-policy.json | tr -d '\r')
          for name in "${handoff_names[@]}"; do
            cp -- "staged-assets/$name" "release-assets/$name"
          done
          (
            cd release-assets
            for name in "${handoff_names[@]}"; do
              sha256sum "$name"
            done
          ) >>release-assets/SHA256SUMS
          sort -o release-assets/SHA256SUMS release-assets/SHA256SUMS
          (
            cd release-assets
            sha256sum --check --strict SHA256SUMS
          )
          {
            jq -er \
              --arg version "${{ needs.verify-candidate.outputs.version }}" \
              '.releases[] | select(.version == $version) | .artifacts[]' \
              release/catalog.json
            jq -er '.artifactPolicy.generatedMetadata[]' \
              release/release-policy.json
            printf '%s\n' "${handoff_names[@]}"
          } | sort >"$RUNNER_TEMP/expected-release-assets"
          find release-assets -mindepth 1 -maxdepth 1 -type f \
            -printf '%f\n' | sort >"$RUNNER_TEMP/actual-release-assets"
          diff -u \
            "$RUNNER_TEMP/expected-release-assets" \
            "$RUNNER_TEMP/actual-release-assets"
          test "$(
            find release-assets -mindepth 1 -maxdepth 1 -type f | wc -l
          )" -eq "$(
            wc -l <"$RUNNER_TEMP/expected-release-assets"
          )"

      - name: Build deterministic verifier predicate and subjects
        shell: bash
        run: |
          set -euo pipefail
          handoff_sha=$(sha256sum release-assets/release-handoff-v1.json |
            awk '{print $1}')
          windows_distribution=$(jq -er '
            .signingIdentities.windowsDistribution // "signed"
          ' release/release-policy.json | tr -d '\r')
          case "$windows_distribution" in
            signed|unsigned) ;;
            *) echo "Unknown Windows distribution mode: $windows_distribution" >&2; exit 1 ;;
          esac
          # The attestation subject describes what was actually published. An unsigned
          # release has no detached CMS object, so `handoff.signature` is absent from
          # the predicate rather than present with an empty digest.
          if [ "$windows_distribution" = unsigned ]; then
            handoff_signature_json=null
          else
            handoff_signature_json=$(
              jq -n --arg sha "$(
                sha256sum release-assets/release-handoff-v1.json.p7s | awk '{print $1}'
              )" '{name: "release-handoff-v1.json.p7s", sha256: $sha, format: "CMS-detached"}'
            )
          fi
          bom_sha=$(sha256sum release-assets/release-bom.json |
            awk '{print $1}')
          readiness=$(
            jq -ecS '
              .readiness |
              select(
                .binding == "git-blob-at-target-sha" and
                .status == "ready" and
                (.blobSha256 | test("^[0-9a-f]{64}$")) and
                .summary.status == "ready"
              )
            ' release-assets/release-bom.json
          )
          hosted_verification=$(jq -s 'sort_by(.platform)' \
            hosted-verification/hosted-verification-*.json)
          jq -S -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "${{ needs.verify-candidate.outputs.tag }}" \
            --arg targetSha "${{ needs.verify-candidate.outputs.target_sha }}" \
            --arg handoffSha256 "$handoff_sha" \
            --argjson handoffSignature "$handoff_signature_json" \
            --arg releaseBomSha256 "$bom_sha" \
            --argjson readiness "$readiness" \
            --argjson hostedVerification "$hosted_verification" \
            '{
              schemaVersion: 1,
              role: "verifier",
              verifier: {
                service: "GitHub Actions",
                workflow: ".github/workflows/release.yml"
              },
              artifactOrigin: {
                builder: "admin-controlled Windows workstation and its WSL2 environment",
                githubBuiltPlatformArchives: false
              },
              repository: $repository,
              tag: $tag,
              targetSha: $targetSha,
              handoff: {
                name: "release-handoff-v1.json",
                sha256: $handoffSha256
              } + (if $handoffSignature == null then {}
                   else {signature: $handoffSignature} end),
              hostedVerification: $hostedVerification,
              releaseBomSha256: $releaseBomSha256,
              readiness: $readiness
            }' >"$RUNNER_TEMP/release-verification-v1.json"
          (
            cd release-assets
            find . -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
              sort |
              while IFS= read -r name; do
                sha256sum "$name"
              done
          ) >"$RUNNER_TEMP/release-subjects.sha256"
          jq -Rn '
            [inputs |
              capture(
                "^(?<sha256>[0-9a-f]{64})  (?<name>[A-Za-z0-9][A-Za-z0-9._+-]*)$"
              ) |
              {
                name: .name,
                digest: {sha256: .sha256}
              }
            ] | sort_by(.name)
          ' <"$RUNNER_TEMP/release-subjects.sha256" \
            >"$RUNNER_TEMP/expected-attestation-subjects.json"

      - name: Detect an exact existing verifier attestation
        id: existing-attestation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh attestation verify \
            release-assets/release-handoff-v1.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type "$TOPIAFORGE_VERIFICATION_PREDICATE" \
            --source-digest "${{ needs.verify-candidate.outputs.target_sha }}" \
            --source-ref "refs/tags/${{ needs.verify-candidate.outputs.tag }}" \
            --deny-self-hosted-runners \
            --format json >"$RUNNER_TEMP/existing-attestation.json" 2>/dev/null &&
            bash ./tools/verify-release-attestation.sh \
              "$RUNNER_TEMP/existing-attestation.json" \
              "$RUNNER_TEMP/release-verification-v1.json" \
              "$RUNNER_TEMP/expected-attestation-subjects.json"; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Attest GitHub verification, not build provenance
        if: >-
          steps.release.outputs.draft == 'true' &&
          steps.existing-attestation.outputs.exists != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ runner.temp }}/release-subjects.sha256
          predicate-type: https://topiaforge.dev/attestations/release-verification/v1
          predicate-path: ${{ runner.temp }}/release-verification-v1.json

      - name: Verify the exact custom attestation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh attestation verify \
            release-assets/release-handoff-v1.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --predicate-type "$TOPIAFORGE_VERIFICATION_PREDICATE" \
            --source-digest "${{ needs.verify-candidate.outputs.target_sha }}" \
            --source-ref "refs/tags/${{ needs.verify-candidate.outputs.tag }}" \
            --deny-self-hosted-runners \
            --format json >"$RUNNER_TEMP/verified-attestation.json"
          bash ./tools/verify-release-attestation.sh \
            "$RUNNER_TEMP/verified-attestation.json" \
            "$RUNNER_TEMP/release-verification-v1.json" \
            "$RUNNER_TEMP/expected-attestation-subjects.json"

      - name: Reaudit complete live repository governance before publication
        env:
          GH_TOKEN: ${{ secrets.TOPIAFORGE_GOVERNANCE_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python3 .github/scripts/audit_repository_governance.py \
            check \
            --repo "$GITHUB_REPOSITORY"

      - name: Revalidate critical governance before publication
        env:
          GH_TOKEN: ${{ secrets.TOPIAFORGE_GOVERNANCE_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          bash ./tools/verify-release-governance.sh "$GITHUB_REPOSITORY"

      - name: Revalidate candidate before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ./tools/verify-release-candidate.sh \
            "$GITHUB_REPOSITORY" \
            "${{ needs.verify-candidate.outputs.tag }}" \
            "${{ needs.verify-candidate.outputs.version }}" \
            "${{ needs.verify-candidate.outputs.target_sha }}"
          (
            cd apps/topiaforge_cli
            dart run bin/topiaforge.dart release validate-readiness \
              --version "${{ needs.verify-candidate.outputs.version }}" \
              --target-sha "${{ needs.verify-candidate.outputs.target_sha }}"
          )
          dotnet run \
            --project tools/TopiaForge.ManagedRefs/TopiaForge.ManagedRefs.csproj \
            --configuration Release \
            -- \
            --probe \
            --require-latest

      - name: Publish or verify the exact immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIAFORGE_GOVERNANCE_AUDIT_TOKEN: ${{ secrets.TOPIAFORGE_GOVERNANCE_AUDIT_TOKEN }}
        run: >-
          ./tools/publish-release-draft.sh
          "$GITHUB_REPOSITORY"
          "${{ needs.verify-candidate.outputs.tag }}"
          "${{ needs.verify-candidate.outputs.target_sha }}"
          "TopiaForge ${{ needs.verify-candidate.outputs.version }}"
          "${{ needs.verify-candidate.outputs.notes_file }}"
          release-assets
          "${{ needs.verify-candidate.outputs.prerelease }}"
          publish

      - name: Re-download and compare every immutable release byte
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          bash ./tools/fetch-release-assets.sh \
            "$GITHUB_REPOSITORY" \
            "${{ needs.verify-candidate.outputs.tag }}" \
            "${{ needs.verify-candidate.outputs.target_sha }}" \
            "TopiaForge ${{ needs.verify-candidate.outputs.version }}" \
            "${{ needs.verify-candidate.outputs.notes_file }}" \
            published-assets \
            "${{ needs.verify-candidate.outputs.prerelease }}"
          (
            cd release-assets
            find . -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
              sort |
              while IFS= read -r name; do
                sha256sum "$name"
              done
          ) >"$RUNNER_TEMP/local-release-assets.sha256"
          (
            cd published-assets
            find . -mindepth 1 -maxdepth 1 -type f -printf '%f\n' |
              sort |
              while IFS= read -r name; do
                sha256sum "$name"
              done
          ) >"$RUNNER_TEMP/published-release-assets.sha256"
          diff -u \
            "$RUNNER_TEMP/local-release-assets.sha256" \
            "$RUNNER_TEMP/published-release-assets.sha256"
