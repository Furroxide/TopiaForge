name: Release package dry run

on:
  push:
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-packages:
    name: Build release packages
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/release/')
    uses: ./.github/workflows/release-package-build.yml
    with:
      source_sha: ${{ github.sha }}
      fail_on_missing_refs: true
      artifact_retention_days: 7

  required-release-packages:
    name: Required / Release packages
    if: always()
    needs: build-packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce successful package matrix
        env:
          RESULT: ${{ needs.build-packages.result }}
        run: test "$RESULT" = success
