name: Unity PR Artifacts

on:
  pull_request:
    branches:
      - main
      - dev
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-pr-artifacts-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  audit-artifacts:
    name: Audit generated artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reject committed Unity build outputs
        shell: bash
        run: |
          tracked="$(git ls-files '*.unitypackage' '*.7z' 'dist/*.topiaforgemod' 'dist/vpm/*.zip' '.unity-ci/**')"
          if [ -n "$tracked" ]; then
            echo "Generated Unity/release artifacts must not be tracked:"
            echo "$tracked"
            exit 1
          fi

  vpm-packages:
    name: Build VPM package listing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: audit-artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: "3.11.1"

      - name: Pack Unity packages
        working-directory: apps/topiaforge_cli
        run: |
          dart pub get --enforce-lockfile
          dart run bin/topiaforge.dart unity pack-packages --output ../../dist/vpm

      - name: Upload VPM listing artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topiaforge-vpm-index
          path: dist/vpm/**
          if-no-files-found: error
          retention-days: 14

  world-smoke:
    name: Build Unity world smoke package (manual main only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: audit-artifacts
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    environment: unity-validation
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.301"

      - name: Set up Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: "3.11.1"

      - name: Scaffold smoke world project
        shell: bash
        working-directory: apps/topiaforge_cli
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE//\\//}"
          dart pub get --enforce-lockfile
          dart run bin/topiaforge.dart new mod ci.world \
            --template world \
            --name "CI World" \
            --dir "$workspace/.unity-ci"
          dart run bin/topiaforge.dart new unity-world CiWorld \
            --dir "$workspace/.unity-ci" \
            --mod "$workspace/.unity-ci/ci.world"

      - name: Build first world bundle
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2 # v4.8.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .unity-ci/CiWorld
          unityVersion: 6000.0.23f1
          targetPlatform: StandaloneWindows64
          buildMethod: TopiaForge.WorldCompanion.Editor.WorldBundleBuilder.Build
          customParameters: >-
            -topiaforgeModPath /github/workspace/.unity-ci/ci.world
            -topiaforgeBundleName ci-world
            -topiaforgeWorldPrefab Assets/World/World.prefab
          manualExit: true
          versioning: None
          allowDirtyBuild: true

      - name: Record first world bundle bytes
        shell: bash
        run: |
          set -euo pipefail
          find .unity-ci/ci.world/AssetBundles -maxdepth 1 -type f \
            \( -name '*.bundle' -o -name '*.manifest.json' \) -print0 |
            sort -z | xargs -0 sha256sum >"$RUNNER_TEMP/world-first.sha256"
          test -s "$RUNNER_TEMP/world-first.sha256"

      - name: Build second world bundle
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2 # v4.8.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .unity-ci/CiWorld
          unityVersion: 6000.0.23f1
          targetPlatform: StandaloneWindows64
          buildMethod: TopiaForge.WorldCompanion.Editor.WorldBundleBuilder.Build
          customParameters: >-
            -topiaforgeModPath /github/workspace/.unity-ci/ci.world
            -topiaforgeBundleName ci-world
            -topiaforgeWorldPrefab Assets/World/World.prefab
          manualExit: true
          versioning: None
          allowDirtyBuild: true

      - name: Require deterministic world bundle bytes
        run: sha256sum --check --strict "$RUNNER_TEMP/world-first.sha256"

      - name: Pack smoke world mod
        shell: bash
        working-directory: apps/topiaforge_cli
        run: |
          set -euo pipefail
          workspace="${GITHUB_WORKSPACE//\\//}"
          dart run bin/topiaforge.dart pack \
            --project "$workspace/.unity-ci/ci.world" \
            --output "$workspace/dist/unity-smoke" \
            --configuration Release

      - name: Upload smoke world artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: topiaforge-unity-world-smoke
          path: |
            dist/unity-smoke/*.topiaforgemod
            .unity-ci/ci.world/AssetBundles/*.bundle
            .unity-ci/ci.world/AssetBundles/*.manifest.json
          if-no-files-found: error
          retention-days: 14

  unity-ui-smoke:
    name: Rebuild and compare TopiaForge UI bundle (manual main only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: audit-artifacts
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    environment: unity-validation
    steps:
      - name: Checkout exact TopiaForge UI sources and tracked bundle
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false

      - name: Import TextMesh Pro essentials with the pinned editor
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2 # v4.8.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: tools/unity-ui-bundle
          unityVersion: 6000.0.23f1
          targetPlatform: StandaloneWindows64
          buildMethod: TopiaForge.UiBundleBuilder.ImportEssentials
          manualExit: true
          versioning: None
          allowDirtyBuild: true

      - name: Build first TopiaForge UI bundle with the pinned editor
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2 # v4.8.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: tools/unity-ui-bundle
          unityVersion: 6000.0.23f1
          targetPlatform: StandaloneWindows64
          buildMethod: TopiaForge.UiBundleBuilder.Build
          manualExit: true
          versioning: None
          allowDirtyBuild: true

      - name: Record first TopiaForge UI bundle and provenance
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            src/TopiaForge.Mods.UnityUi/Assets/topiaforge-ui.bundle \
            src/TopiaForge.Mods.UnityUi/Assets/topiaforge-ui.manifest.json \
            tools/unity-ui-bundle/Assets/UiBundleManifest.json \
            >"$RUNNER_TEMP/unity-ui-first.sha256"

      - name: Build second TopiaForge UI bundle with the pinned editor
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2 # v4.8.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: tools/unity-ui-bundle
          unityVersion: 6000.0.23f1
          targetPlatform: StandaloneWindows64
          buildMethod: TopiaForge.UiBundleBuilder.Build
          manualExit: true
          versioning: None
          allowDirtyBuild: true

      - name: Verify tracked TopiaForge UI bytes and provenance are reproducible
        shell: bash
        run: |
          set -euo pipefail
          bundle=src/TopiaForge.Mods.UnityUi/Assets/topiaforge-ui.bundle
          provenance=src/TopiaForge.Mods.UnityUi/Assets/topiaforge-ui.manifest.json
          sha256sum --check --strict "$RUNNER_TEMP/unity-ui-first.sha256"
          test -s "$bundle"
          test "$(jq -er '.editorVersion' "$provenance")" = 6000.0.23f1
          test "$(jq -er '.editorVersion' tools/unity-ui-bundle/Assets/UiBundleManifest.json)" = 6000.0.23f1
          test "$(jq -er '.sha256' "$provenance")" = "$(sha256sum "$bundle" | awk '{print $1}')"
          git diff --exit-code -- \
            "$bundle" \
            "$provenance" \
            tools/unity-ui-bundle/Assets/UiBundleManifest.json \
            tools/unity-ui-bundle/Assets/FontAssets

  unity-validation:
    name: Required / Unity source validation
    if: always()
    needs: [audit-artifacts, vpm-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all secretless Unity checks
        env:
          AUDIT_RESULT: ${{ needs.audit-artifacts.result }}
          VPM_RESULT: ${{ needs.vpm-packages.result }}
        run: |
          test "$AUDIT_RESULT" = success
          test "$VPM_RESULT" = success

  trusted-unity-validation:
    # `Required / Unity validation` is the exact protected manual release
    # context. Do not add it to ordinary PR branch protection: credentialed
    # jobs are intentionally skipped for pull requests and forks.
    name: Required / Unity validation
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    needs: [world-smoke, unity-ui-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both protected Unity 6000.0.23f1 builds
        env:
          WORLD_RESULT: ${{ needs.world-smoke.result }}
          UNITY_UI_RESULT: ${{ needs.unity-ui-smoke.result }}
        run: |
          test "$WORLD_RESULT" = success
          test "$UNITY_UI_RESULT" = success
