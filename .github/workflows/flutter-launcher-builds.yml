name: Flutter launcher builds

on:
  workflow_call:
    inputs:
      artifact_retention_days:
        description: "Number of days to retain launcher artifacts."
        required: false
        type: number
        default: 14
      source_sha:
        description: "Exact commit to build."
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      artifact_retention_days:
        description: "Number of days to retain launcher artifacts."
        required: false
        type: number
        default: 14

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} launcher
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          lfs: true
          persist-credentials: false

      - name: Verify launcher LFS assets are hydrated
        shell: bash
        run: |
          set -euo pipefail
          git lfs fsck
          git lfs ls-files --name-only \
            --include='apps/topiaforge_launcher_flutter/**' \
            | while IFS= read -r asset; do
                if git lfs pointer --check --file="$asset" >/dev/null 2>&1; then
                  echo "::error file=$asset::Git LFS asset was not hydrated."
                  exit 1
                fi
              done

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.4"
          cache: true

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Build launcher
        shell: bash
        working-directory: apps/topiaforge_launcher_flutter
        env:
          # Flutter forwards FLUTTER_XCODE_* variables as Xcode build settings.
          # The protected release job signs this reusable build output later.
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: ${{ matrix.platform == 'macos' && 'NO' || '' }}
          FLUTTER_XCODE_CODE_SIGNING_REQUIRED: ${{ matrix.platform == 'macos' && 'NO' || '' }}
          LAUNCHER_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          flutter build "$LAUNCHER_PLATFORM" --release

      - name: Verify unsigned macOS launcher policy
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          project_dir="apps/topiaforge_launcher_flutter/macos"
          app="apps/topiaforge_launcher_flutter/build/macos/Build/Products/Release/TopiaForge.app"
          test -d "$app"
          # Apple-silicon Mach-O binaries can receive a linker-created ad-hoc
          # signature even when Xcode identity signing is disabled.
          signature_details=''
          if signature_details="$(codesign -d --verbose=4 "$app" 2>&1)"; then
            if ! grep -Fxq 'Signature=adhoc' <<< "$signature_details" \
              || ! grep -Fxq 'TeamIdentifier=not set' <<< "$signature_details" \
              || grep -Eq '^Authority=' <<< "$signature_details"; then
              printf '%s\n' "$signature_details"
              echo '::error::The reusable launcher build must not carry an identity or team signature.'
              exit 1
            fi
          elif ! grep -Fq 'code object is not signed at all' <<< "$signature_details"; then
            printf '%s\n' "$signature_details"
            echo '::error::Unable to verify the reusable launcher signature state.'
            exit 1
          fi

          settings="$(xcodebuild \
            -project "$project_dir/Runner.xcodeproj" \
            -target Runner \
            -configuration Release \
            -showBuildSettings)"
          if ! grep -Eq '^[[:space:]]*ENABLE_HARDENED_RUNTIME = YES$' <<< "$settings"; then
            echo '::error::The release launcher must enable the hardened runtime before signing.'
            exit 1
          fi
          entitlements_path="$(awk -F ' = ' \
            '/^[[:space:]]*CODE_SIGN_ENTITLEMENTS = / { print $2; exit }' \
            <<< "$settings")"
          if [ "$entitlements_path" != 'Runner/Release.entitlements' ]; then
            echo "::error::Unexpected release entitlements path: $entitlements_path"
            exit 1
          fi
          entitlements="$(plutil -p "$project_dir/$entitlements_path")"
          if grep -Fq 'com.apple.security.app-sandbox' <<< "$entitlements"; then
            echo '::error::The launcher cannot perform install/repair or launch work while App Sandbox is enabled.'
            exit 1
          fi
          if grep -Fq 'com.apple.security.get-task-allow' <<< "$entitlements"; then
            echo '::error::The release launcher must not carry the debug get-task-allow entitlement.'
            exit 1
          fi

      - name: Pack launcher artifact
        shell: bash
        env:
          LAUNCHER_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP//\\//}/launcher-artifact"
          mkdir -p "$artifact_dir"
          case "$LAUNCHER_PLATFORM" in
            windows)
              release_dir="apps/topiaforge_launcher_flutter/build/windows/x64/runner/Release"
              if [ ! -d "$release_dir" ]; then
                release_dir="apps/topiaforge_launcher_flutter/build/windows/runner/Release"
              fi
              # GNU tar otherwise treats the drive-letter colon as a remote host.
              tar --force-local -cf "$artifact_dir/launcher-windows.tar" -C "$release_dir" .
              ;;
            linux)
              release_dir="apps/topiaforge_launcher_flutter/build/linux/x64/release/bundle"
              if [ ! -d "$release_dir" ]; then
                release_dir="apps/topiaforge_launcher_flutter/build/linux/release/bundle"
              fi
              tar -cf "$artifact_dir/launcher-linux.tar" -C "$release_dir" .
              ;;
            macos)
              release_dir="apps/topiaforge_launcher_flutter/build/macos/Build/Products/Release"
              app_name="TopiaForge.app"
              if [ ! -d "$release_dir/$app_name" ]; then
                echo "::error::Could not locate TopiaForge.app in $release_dir."
                exit 1
              fi
              tar -cf "$artifact_dir/launcher-macos.tar" -C "$release_dir" "$app_name"
              ;;
          esac

      - name: Upload launcher artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-${{ matrix.platform }}
          path: ${{ runner.temp }}/launcher-artifact/launcher-${{ matrix.platform }}.tar
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days || 14 }}
