name: Deploy launcher update + mod registry indexes

on:
  workflow_dispatch:
  # Community registry merges go live without waiting for a release tag.
  push:
    branches: [main]
    paths:
      - "registry/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Restore CLI packages
        working-directory: apps/robotopia_cli
        run: dart pub get

      - name: Build launcher update index
        working-directory: apps/robotopia_cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAUNCHER_UPDATE_BASE_URL: ${{ vars.LAUNCHER_UPDATE_BASE_URL }}
        run: dart run robotopia updates index --repository "$GITHUB_REPOSITORY" --output "../../_site"

      # A Pages deploy replaces the whole site, so this workflow must always
      # build BOTH indexes or the release workflow's registry would vanish.
      - name: Build mod registry index
        working-directory: apps/robotopia_cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          dart run robotopia registry index
          --repository "$GITHUB_REPOSITORY"
          --entries ../../registry
          --changelogs ../../mods
          --output ../../_site/registry

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-index
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
