name: Feature proposal
description: Propose a focused ecosystem or author-workflow improvement.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or mod-author problem, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and security impact
      description: Note public API, schema, save, package, registry, platform, and trust-boundary effects.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
