name: launcher_data
description: Local filesystem repositories for the TopiaForge standalone launcher.
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.11.1

dependencies:
  # 4.6 changes damaged-data decoding to return partial output by default.
  # Preserve strict ZIP rejection until all readers migrate to its new API.
  archive: '>=4.0.7 <4.6.0'
  crypto: ^3.0.6
  cryptography: ^2.9.0
  launcher_domain:
    path: ../launcher_domain
  path: ^1.9.1
  unorm_dart: ^0.3.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
