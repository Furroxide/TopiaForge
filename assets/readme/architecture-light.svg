<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">TopiaForge architecture</title>
<desc id="d">Inside the game process, BepInEx and UnityDoorstop load TopiaForge.ModManager, which owns the Unity-free core, the V1 safe contracts, and the in-game UI renderer. On the desktop, the launcher and the topiaforge CLI share launcher_data and launcher_domain and never load game code.</desc>

